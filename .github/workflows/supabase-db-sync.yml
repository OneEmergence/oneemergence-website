name: Supabase Migration Preview

# Replaces the legacy DB/supabase SQL replay workflow. The canonical deployment
# history lives in supabase/migrations; a push must never replay old SQL files.
# This manually triggered workflow lists pending migrations without applying them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Preview pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Preview migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "Configure the SUPABASE_DB_URL repository secret for the intended database."
            exit 1
          fi

          pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
