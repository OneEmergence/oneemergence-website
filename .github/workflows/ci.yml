name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Journal autosave scheduling
        run: pnpm test:journal-autosave

      - name: Build
        run: pnpm build

  journal-lifecycle:
    name: Journal lifecycle (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journal_test
          POSTGRES_PASSWORD: journal_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Credentials belong only to this disposable runner-local service.
    # The test creates a random database and drops only that database afterward.
    env:
      JOURNAL_TEST_ADMIN_URL: postgresql://journal_test:journal_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run Journal lifecycle regression
        run: pnpm test:journal-lifecycle

  test:
    name: Playwright Tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's webServer runs `pnpm build && pnpm start`, and `next start`
    # boots with NODE_ENV=production — so src/lib/env.ts enforces
    # REQUIRED_IN_PROD at boot and the server never comes up without these.
    # Same placeholder convention as the Dockerfile: non-empty (Zod uses
    # .min(1)) but deliberately non-resolving, so nothing real is reachable
    # from CI. Tests needing genuine credentials detect "placeholder" and skip.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # A single invocation builds/starts the app once and keeps every suite
      # in the same report. GitHub annotations alone do not create HTML.
      - name: Run smoke, accessibility, content and environment tests
        run: pnpm exec playwright test tests/smoke tests/a11y tests/content tests/environment --project=chromium --reporter=github,html

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
