name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Playwright Tests
    needs: quality
    runs-on: ubuntu-latest
    # Playwright's webServer runs `pnpm build && pnpm start`, and `next start`
    # boots with NODE_ENV=production — so src/lib/env.ts enforces
    # REQUIRED_IN_PROD at boot and the server never comes up without these.
    # Same placeholder convention as the Dockerfile: non-empty (Zod uses
    # .min(1)) but deliberately non-resolving, so nothing real is reachable
    # from CI. Tests needing genuine credentials detect "placeholder" and skip.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm exec playwright test tests/smoke --project=chromium

      - name: Run accessibility tests
        run: pnpm exec playwright test tests/a11y --project=chromium

      - name: Run content validation
        run: pnpm exec playwright test tests/content --project=chromium

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
