name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  perf-and-mobile:
    name: Performance & Mobile Playwright
    runs-on: ubuntu-latest
    # See ci.yml — `next start` enforces REQUIRED_IN_PROD at boot, so the
    # Playwright webServer cannot come up without these placeholders.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run performance tests
        continue-on-error: false
        run: pnpm test:perf

      - name: Run mobile responsive tests
        continue-on-error: false
        run: pnpm exec playwright test --project=mobile

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 14
